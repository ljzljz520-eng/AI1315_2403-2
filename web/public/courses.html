<main class="page"><div class="eyebrow">COURSES</div><h1>给每一种好奇，留一张课表。</h1><p class="lead">从第一次拉坯到稳定创作，按自己的节奏入门。每门课都包含泥料、工具、烧制和老师指导。</p><section class="section"><div class="grid"><article class="card"><span class="card-tag">周末 · 2 小时</span><h3>拉坯入门</h3><p>认识转盘与泥性，完成一只杯或一只小碗。</p></article><article class="card"><span class="card-tag">平日 · 2.5 小时</span><h3>手捏器物</h3><p>用指纹、线条和纹理，让器物保留手的痕迹。</p></article><article class="card"><span class="card-tag">进阶 · 3 小时</span><h3>釉色实验室</h3><p>学习配釉逻辑，把颜色交给窑火做最后决定。</p></article></div></section><section class="section"><div class="section-head"><h2>一场课的四个时刻</h2></div><div class="timeline"><div class="timeline-step"><strong>和泥</strong><span class="mini-note">排出空气，找到手感。</span></div><div class="timeline-step"><strong>成形</strong><span class="mini-note">让泥从中心向外生长。</span></div><div class="timeline-step"><strong>装饰</strong><span class="mini-note">刻一条线或留一处留白。</span></div><div class="timeline-step"><strong>入窑</strong><span class="mini-note">把期待交给火。</span></div></div></section></main><footer class="footer"><div class="footer-inner"><span>课程可单次预约，也可组合购买</span><a href="booking.html">选择时间</a></div></footer><script src="app.js"></script></body></html>
