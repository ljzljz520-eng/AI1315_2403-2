<main class="page"><div class="eyebrow">GLAZE LIBRARY</div><h1>颜色不是涂上去的，是烧出来的。</h1><p class="lead">每一种釉在窑里都有自己的变化。我们为体验课准备了六种基础釉，也欢迎你在釉色实验室慢慢试。</p><section class="section"><div class="grid"><article class="card"><div class="swatch celadon"></div><h3>雨青</h3><p>清透、安静，适合日常餐器。</p></article><article class="card"><div class="swatch sand"></div><h3>麦芽</h3><p>温暖的砂糖色，适合手捏纹理。</p></article><article class="card"><div class="swatch iron"></div><h3>夜铁</h3><p>深色底釉，让刻痕更有重量。</p></article><article class="card"><div class="swatch copper"></div><h3>赤铜</h3><p>带一点火焰感的橘红，窑变丰富。</p></article><article class="card"><div class="swatch moon"></div><h3>月白</h3><p>接近白瓷的柔和，适合留白。</p></article><article class="card"><div class="swatch"></div><h3>松烟</h3><p>青灰之间，像雨天的屋檐。</p></article></div></section></main><footer class="footer"><div class="footer-inner"><span>每批釉色样片均在店内实物展示</span><a href="booking.html">预约体验</a></div></footer><script src="app.js"></script></body></html>
