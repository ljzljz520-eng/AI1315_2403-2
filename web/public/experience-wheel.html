<main class="page"><section class="detail-layout"><div class="detail-image" aria-label="转盘上的陶土"></div><div><div class="eyebrow">PROJECT 01</div><h1>拉坯入门</h1><p class="lead">把一团泥放在转盘中心，用手的压力让它站起来。你会带走一只约 8cm 高的杯子。</p><div class="facts"><div class="fact"><span>时长</span><strong>120 分钟</strong></div><div class="fact"><span>人数</span><strong>1–8 人</strong></div><div class="fact"><span>费用</span><strong>¥268 / 人</strong></div><div class="fact"><span>取件</span><strong>约 3 周</strong></div></div><a class="button" href="booking.html">预约拉坯</a></div></section><section class="section"><h2>你会经历</h2><div class="number-list"><div class="number-item"><span class="number">01</span><div><h3>找中心</h3><p class="mini-note">老师会帮你理解手掌、泥和转盘的关系。</p></div></div><div class="number-item"><span class="number">02</span><div><h3>向上拉</h3><p class="mini-note">让杯壁变薄，练习稳定而持续的力量。</p></div></div><div class="number-item"><span class="number">03</span><div><h3>留下指纹</h3><p class="mini-note">选择一款釉色，把你的使用痕迹交给窑火。</p></div></div></div></section></main><footer class="footer"><div class="footer-inner"><span>不会拉坯也没关系，老师会陪你完成</span><a href="experience.html">返回项目</a></div></footer><script src="app.js"></script></body></html>
