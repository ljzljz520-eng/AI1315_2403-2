<main class="page"><div class="eyebrow">BOOK A TABLE</div><h1>留一个下午，给自己。</h1><p class="lead">填写偏好，我们会在一个工作日内确认具体席位。演示站会把预约写入一条固定的内存记录。</p><section class="section"><form class="form" data-booking-form><div class="field-grid"><label>称呼<input name="operator" required placeholder="怎么称呼你"></label><label>联系电话<input name="phone" required placeholder="手机号码"></label><label>体验项目<select name="project"><option>拉坯入门</option><option>手捏杯子</option><option>盘中风景</option></select></label><label>希望日期<input type="date" name="date" value="2026-09-12" required></label><label>时间段<select name="slot"><option>10:00-12:00</option><option>14:00-16:00</option><option>19:00-21:00</option></select></label><label>人数<select name="people"><option>1 人</option><option>2 人</option><option>3-4 人</option><option>5-8 人</option></select></label></div><label style="margin-top:16px">备注<textarea name="note" placeholder="例如：想和朋友坐在一起"></textarea></label><div class="actions"><button class="button" type="submit">提交预约</button><a class="button secondary" href="contact.html">先咨询门店</a></div><div class="status" data-status role="status"></div></form></section></main><footer class="footer"><div class="footer-inner"><span>工作日 10:00–21:00 · 周一休息</span><a href="index.html">返回首页</a></div></footer><script src="app.js"></script></body></html>
